<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Capitales del Mundo</title>

<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:18px;line-height:1.35}
.card{max-width:900px;margin:auto;padding:16px;border:1px solid #ddd;border-radius:14px}
h1{margin:0 0 10px 0;font-size:20px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:160px}
button,input,select{padding:10px;border-radius:10px;border:1px solid #ccc;font-size:16px;width:100%}
button{cursor:pointer;background:#f6f6f6}
.qbox{margin-top:14px;padding:12px;border:1px solid #eee;border-radius:12px}
.status{margin-top:10px;font-weight:700}
.ok{color:#0a7a29}
.bad{color:#b00020}
</style>
</head>

<body>

<div class="card">

<h1>Capitales del Mundo 🌍</h1>

<!-- MENU -->
<div id="menu" class="qbox">

<div class="row">
<button id="goComp">Modo Competición</button>
<button id="goPractice">Modo Práctica</button>
</div>

</div>


<!-- COMP -->
<div id="setupComp" class="qbox" style="display:none">

<label>Tu nombre</label>
<input id="compName">

<div class="row">
<button id="btnCompStart">Empezar</button>
<button id="btnBack1">Volver</button>
</div>

</div>


<!-- PRACTICE -->
<div id="setupPractice" class="qbox" style="display:none">

<label>Tu nombre</label>
<input id="pracName">

<label>Nº preguntas</label>
<select id="pracN">
<option value="10">10</option>
<option value="15">15</option>
<option value="20">20</option>
<option value="all">Todos</option>
</select>

<label>Tipo de pregunta</label>
<select id="pracMode">
<option value="cap">País → Capital</option>
<option value="country">Capital → País</option>
<option value="mix">Mixto</option>
</select>

<div class="row">
<button id="btnPracticeStart">Empezar</button>
<button id="btnBack2">Volver</button>
</div>

</div>


<!-- GAME -->
<div id="game" class="qbox" style="display:none">

<div id="qHeader"></div>

<label id="qLabel"></label>
<input id="answer">

<div class="row" style="margin-top:10px">
<button id="btnSubmit">Responder</button>
<button id="btnNext" disabled>Siguiente</button>
</div>

<div id="feedback" class="status"></div>

</div>


<!-- RESULT -->
<div id="result" class="qbox" style="display:none">

<div id="finalScore" style="font-weight:900;font-size:20px"></div>

<button id="btnMenu">Volver al menú</button>

</div>

</div>


<script>

const DATA=[
["España","Madrid"],
["Francia","París"],
["Italia","Roma"],
["Alemania","Berlín"],
["Portugal","Lisboa"],
["Países Bajos","Ámsterdam"],
["Bélgica","Bruselas"],
["Suiza","Berna"],
["Austria","Viena"],
["Irlanda","Dublín"],
["Reino Unido","Londres"],
["Noruega","Oslo"],
["Suecia","Estocolmo"],
["Finlandia","Helsinki"],
["Dinamarca","Copenhague"],
["Polonia","Varsovia"],
["Chequia","Praga"],
["Hungría","Budapest"],
["Rumanía","Bucarest"],
["Grecia","Atenas"],
["Estados Unidos","Washington"],
["Canadá","Ottawa"],
["México","Ciudad de México"],
["Argentina","Buenos Aires"],
["Brasil","Brasilia"],
["Chile","Santiago"],
["Perú","Lima"],
["Japón","Tokio"],
["China","Pekín"],
["Corea del Sur","Seúl"],
["India","Nueva Delhi"],
["Indonesia","Yakarta"],
["Filipinas","Manila"],
["Egipto","El Cairo"],
["Marruecos","Rabat"],
["Nigeria","Abuya"],
["Kenia","Nairobi"],
["Sudáfrica","Pretoria"],
["Australia","Canberra"],
["Nueva Zelanda","Wellington"]
]

const $=id=>document.getElementById(id)

function shuffle(a){
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1))
;[a[i],a[j]]=[a[j],a[i]]
}
}

let state={
questions:[],
idx:0,
score:0
}


function startGame(list){

state.questions=list
state.idx=0
state.score=0

$("menu").style.display="none"
$("setupComp").style.display="none"
$("setupPractice").style.display="none"
$("game").style.display="block"

showQuestion()

}


function showQuestion(){

let q=state.questions[state.idx]

$("qHeader").textContent=`${state.idx+1}/${state.questions.length}`

if(q.mode==="cap"){
$("qLabel").textContent=`Capital de ${q.country}`
}else{
$("qLabel").textContent=`País de ${q.capital}`
}

$("answer").value=""
$("feedback").textContent=""
$("btnSubmit").disabled=false
$("btnNext").disabled=true

}


function submitAnswer(){

let q=state.questions[state.idx]
let ans=$("answer").value.trim().toLowerCase()

let correct=(q.mode==="cap"?q.capital:q.country).toLowerCase()

if(ans===correct){
state.score++
$("feedback").textContent="✅ Correcto"
$("feedback").className="status ok"
}else{
$("feedback").textContent=`❌ Correcto: ${correct}`
$("feedback").className="status bad"
}

$("btnSubmit").disabled=true
$("btnNext").disabled=false

}


function nextQuestion(){

state.idx++

if(state.idx>=state.questions.length){
finish()
}else{
showQuestion()
}

}


function finish(){

$("game").style.display="none"
$("result").style.display="block"

$("finalScore").textContent=`Resultado: ${state.score}/${state.questions.length}`

}


/* COMPETITION */

function startCompetition(){

let list=DATA.slice()
shuffle(list)

let a=list.slice(0,10).map(x=>({country:x[0],capital:x[1],mode:"cap"}))
let b=list.slice(10,20).map(x=>({country:x[0],capital:x[1],mode:"country"}))

let q=[...a,...b]
shuffle(q)

startGame(q)

}


/* PRACTICE */

function startPractice(){

let nRaw=$("pracN").value
let mode=$("pracMode").value

let list=DATA.slice()
shuffle(list)

let n=(nRaw==="all")?list.length:Number(nRaw)

list=list.slice(0,n)

let q=list.map(x=>{

let m

if(mode==="mix"){
m=Math.random()<0.5?"cap":"country"
}else{
m=mode
}

return{country:x[0],capital:x[1],mode:m}

})

startGame(q)

}


/* BUTTONS */

$("goComp").onclick=()=>{
$("menu").style.display="none"
$("setupComp").style.display="block"
}

$("goPractice").onclick=()=>{
$("menu").style.display="none"
$("setupPractice").style.display="block"
}

$("btnBack1").onclick=()=>{
$("setupComp").style.display="none"
$("menu").style.display="block"
}

$("btnBack2").onclick=()=>{
$("setupPractice").style.display="none"
$("menu").style.display="block"
}

$("btnCompStart").onclick=startCompetition
$("btnPracticeStart").onclick=startPractice

$("btnSubmit").onclick=submitAnswer
$("btnNext").onclick=nextQuestion

$("btnMenu").onclick=()=>{
$("result").style.display="none"
$("menu").style.display="block"
}

</script>

</body>
</html>
